<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section class="card" aria-labelledby="titulo">
            <p class="eyebrow">PROJETO PRÁTICO</p>
            <h1 id="titulo">🎉 Sorteador Online</h1>
            <p class="subtitle">
                Digite nomes ou itens separados por vírgula ou por linha.
            </p>

            <form id="sorteadorForm">
                <label for="listaEntrada">Itens para o sorteio</label>
                <textarea id="listaEntrada" rows="6" placeholder="Exemplo: Ana, Bruno, Carla, Daniel"
                    aria-describedby="ajudaEntrada"></textarea>
                <p id="ajudaEntrada" class="help-text">
                    Você pode separar os itens por vírgula ou pressionar Enter.
                </p>

                <div class="button-group">
                    <button id="btnSortear" class="btn-primary" type="submit">
                        Sortear agora
                    </button>
                    <button id="btnLimpar" class="btn-secondary" type="button">
                        Limpar
                    </button>
                </div>
            </form>

            <div id="status" class="status" role="status" aria-live="polite"></div>

            <section id="resultadoBox" class="resultado-container hidden" aria-live="polite">
                <p class="result-label">O grande vencedor foi:</p>
                <div id="resultado" class="ganhador-destaque">---</div>
            </section>

            <section class="historico-box" aria-labelledby="tituloHistorico">
                <h2 id="tituloHistorico">Histórico</h2>
                <ul id="historico"></ul>
            </section>
        </section>
    </main>

    <!-- essa biblioteca aqui já traz pronta a animação de confetes, então não precisa programar do zero -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
